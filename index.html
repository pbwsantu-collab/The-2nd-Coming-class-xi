function move(d){const n=state.i+d;if(n>=0&&n<QUESTIONS.length){state.i=n;render();$("quiz").scrollIntoView({behavior:"smooth"})}}
function restart(){if(!confirm("Restart the 100-question test?"))return;state.i=0;state.answers.fill(null);state.locked.fill(false);$("result").classList.add("hidden");$("search").value="";$("searchResults").innerHTML="";render();scrollTo(0,0)}
function finish(){const a=state.answers.filter(x=>x!==null).length,c=state.answers.reduce((s,_,i)=>s+(right(i)?1:0),0),p=Math.round(c/QUESTIONS.length*100);$("result").classList.remove("hidden");$("result").innerHTML=`<div class="big">${c} / ${QUESTIONS.length}</div><h2>Test Result</h2><p>Answered: <b>${a}</b> • Correct: <b>${c}</b> • Accuracy: <b>${p}%</b></p><p>${p>=80?"🏆 Excellent preparation!":p>=60?"👍 Good work—revise weaker areas.":"📖 Revise the poem, symbols, vocabulary and context."}</p>`;$("result").scrollIntoView({behavior:"smooth"})}
function flowers(){const s=["🌸","🌺","🌼","🌷","💮","🌻"];for(let n=0;n<28;n++){const f=document.createElement("span");f.className="flower";f.textContent=s[Math.floor(Math.random()*s.length)];f.style.left=Math.random()*100+"vw";f.style.animationDuration=1.8+Math.random()*2.2+"s";f.style.animationDelay=Math.random()*.4+"s";f.style.fontSize=18+Math.random()*18+"px";$("flowers").appendChild(f);setTimeout(()=>f.remove(),5000)}}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("restart").onclick=restart;$("finish").onclick=finish;
$("search").oninput=e=>{const t=e.target.value.trim().toLowerCase(),box=$("searchResults");if(!t){box.innerHTML="";return}const m=QUESTIONS.map((q,i)=>({q,i})).filter(o=>o.q.join(" ").toLowerCase().includes(t)).slice(0,25);box.innerHTML=m.length?m.map(o=>`<div class="searchItem" data-i="${o.i}"><b>Q${o.i+1}</b> — ${esc(o.q[0])}</div>`).join(""):`<div class="searchItem">No matching question found.</div>`;box.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{state.i=+el.dataset.i;box.innerHTML="";$("search").value="";render();$("quiz").scrollIntoView({behavior:"smooth"})})};
$("meaningBank").innerHTML=Object.entries(MEANINGS).map(([w,d])=>`<div class="meaning"><b>${esc(w)}</b> — ${esc(d[0])}<span class="bn">বাংলা: ${esc(d[1])}</span></div>`).join("");render();
</script></body></html>
